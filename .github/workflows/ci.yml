name: CI Spring Boot Docker
 
on:
  push:
    branches:
      - main
 
jobs:
  build-backend:
    runs-on: ubuntu-latest
 
    defaults:
      run:
        working-directory: test15b
 
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
 
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
 
      - name: Compilar proyecto
        run: mvn clean package -DskipTests
 
      - name: Verificar JAR generado
        run: ls -la target
 
      - name: Construir imagen Docker
        run: docker build -t backend-springboot .

      - name: Compilar proyecto
        run: mvn clean package -DskipTests
     
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
 
      - name: Construir imagen Docker
        run: docker build -t melissasaenzz/backend-spring:latest .
     
      - name: Publicar imagen en Docker Hub
        run: docker push melissasaenzz/backend-spring:latest
  deploy-backend:
    needs: build-backend
    runs-on: self-
    steps:
      - name: Actualizar el contenedor backend
        shell: powershell
        run: |
          cd "C:\Users\lamel\Escritorio\deploy\proyecto_docker_compose_limpio"

          $docker = "C:\Users\lamel\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"

          & $docker compose pull backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $docker compose up -d backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    