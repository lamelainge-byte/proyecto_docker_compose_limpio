name: CI Spring Boot Docker
 
on:
  push:
    branches:
      - main
 
jobs:
  build-backend:
    runs-on: ubuntu-latest
 
    defaults:
      run:
        working-directory: test15b
 
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
 
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: test15b/pom.xml
 
      - name: Compilar proyecto
        shell: bash
        run: |
          for intento in 1 2 3; do
            echo "Intento $intento de 3"
 
            if mvn clean package -DskipTests -U; then
              exit 0
            fi
 
            if [ "$intento" -lt 3 ]; then
              echo "Falló la compilación. Esperando 60 segundos..."
              sleep 60
            fi
          done
 
          echo "La compilación falló después de 3 intentos."
          exit 1
 
      - name: Verificar JAR generado
        run: ls -la target
 
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
 
      - name: Construir imagen Docker
        run: docker build -t melissasaenzz/backend-spring:latest .
 
      - name: Publicar imagen en Docker Hub
        run: docker push melissasaenzz/backend-spring:latest
 
  deploy-backend:
    needs: build-backend
    runs-on: self-hosted
 
    steps:
      - name: Actualizar el contenedor backend
        shell: powershell
        run: |
          cd "C:\Users\lamel\Escritorio\deploy\proyecto_docker_compose_limpio"
 
          docker compose pull backend
          docker compose up -d backend
    