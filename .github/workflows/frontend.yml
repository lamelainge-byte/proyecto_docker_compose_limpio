name: CI CD Frontend

on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t melissasaenzz/frontend-nginx:latest ./frontend_test

      - name: Publicar imagen en Docker Hub
        run: docker push melissasaenzz/frontend-nginx:latest

  deploy-frontend:
    needs: build-frontend
    runs-on: self-hosted

    steps:
      - name: Actualizar el contenedor frontend
        shell: powershell
        run: |
          cd "C:\Users\lamel\Escritorio\deploy\proyecto_docker_compose_limpio"

          docker compose pull frontend
          docker compose up -d frontend